[project]
name = "cutefish-qwen-tts-runtime"
version = "0.1.0"
description = "Isolated Windows runtime for CuteFish Qwen3-TTS"
requires-python = "==3.12.*"
dependencies = [
  "accelerate==1.12.0",
  "qwen-tts==0.1.1",
  "soundfile==0.13.1",
  "torch==2.8.0+cu128",
  "torchaudio==2.8.0+cu128",
  "transformers==4.57.3",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
